<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" width="320" height="240" role="img" aria-labelledby="title desc">
  <title id="title">Cosmo, the cOSmOS mascot</title>
  <desc id="desc">A small smiling blue planet with a pink and orange ring, floating among stars.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#05061c"/>
      <stop offset="1" stop-color="#371250"/>
    </linearGradient>
    <radialGradient id="planet" cx="0.38" cy="0.32" r="0.75">
      <stop offset="0" stop-color="#8cd2ff"/>
      <stop offset="0.55" stop-color="#3f7fd6"/>
      <stop offset="1" stop-color="#193c96"/>
    </radialGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffc878"/>
      <stop offset="1" stop-color="#c878ff"/>
    </linearGradient>
  </defs>
  <rect width="320" height="240" rx="18" fill="url(#sky)"/>
  <g fill="#e8ecff">
    <circle cx="28" cy="30" r="1.6"/><circle cx="70" cy="190" r="1.2"/><circle cx="292" cy="44" r="1.8"/>
    <circle cx="250" cy="200" r="1.3"/><circle cx="40" cy="120" r="1"/><circle cx="300" cy="140" r="1.1"/>
    <circle cx="120" cy="22" r="1.2"/><circle cx="210" cy="28" r="1"/><circle cx="160" cy="222" r="1.4"/>
  </g>
  <path d="M 172 34 l 3 7 7 3 -7 3 -3 7 -3 -7 -7 -3 7 -3 z" fill="#fff6b0"/>
  <!-- back half of the ring -->
  <path d="M 60 128 A 100 26 0 0 1 260 128" fill="none" stroke="url(#ring)" stroke-width="7" opacity="0.85"/>
  <!-- planet -->
  <circle cx="160" cy="122" r="66" fill="url(#planet)"/>
  <!-- face -->
  <ellipse cx="138" cy="114" rx="7" ry="9" fill="#0d1a3a"/>
  <ellipse cx="182" cy="114" rx="7" ry="9" fill="#0d1a3a"/>
  <circle cx="140.5" cy="110.5" r="2.4" fill="#ffffff"/>
  <circle cx="184.5" cy="110.5" r="2.4" fill="#ffffff"/>
  <ellipse cx="126" cy="132" rx="9" ry="5" fill="#ff8fc8" opacity="0.6"/>
  <ellipse cx="194" cy="132" rx="9" ry="5" fill="#ff8fc8" opacity="0.6"/>
  <path d="M 148 134 Q 160 146 172 134" fill="none" stroke="#0d1a3a" stroke-width="4" stroke-linecap="round"/>
  <!-- front half of the ring, crossing in front of the planet -->
  <path d="M 60 128 A 100 26 0 0 0 260 128" fill="none" stroke="url(#ring)" stroke-width="7"/>
  <text x="160" y="226" text-anchor="middle" font-family="monospace" font-size="15" font-weight="700" fill="#ffffff">Cosmo</text>
</svg>
